name: phonecam
description: "Free Phone-to-Webcam MVP for Android and Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.1
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  network_info_plus: ^6.1.0
  web_socket_channel: ^3.0.1
  ffi: ^2.1.3
  win32: ^5.10.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
